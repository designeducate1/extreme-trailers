ter;gap:8px;padding:9px 11px;font:700 9.5px system-ui,sans-serif;transition:all .14s;display:flex}.topt:hover{color:#def;background:#ffffff24}.topt small{letter-spacing:.5px;text-transform:none;color:#def6;font:600 9px system-ui}</style>

  <body>
    <div id="tidepanel">
      <div class="plbl">Tide clocks — pick a port</div>
      <div id="tide-main">
        <svg id="tide-svg" viewBox="0 0 62 62"></svg>
        <div id="tide-name"></div><div id="tide-sub"></div>
        <div id="tide-status"></div>
        <div id="tide-why"></div>
      </div>
      <hr class="pdiv">
      <div class="plbl">Other ports</div>
      <div id="tide-opts"></div>
    </div>
    <div id="panel">
      <div class="p-row">
        <select id="cam-sel" class="p-sel" title="Camera view"></select>
        <select id="loc-sel" class="p-sel" title="Location"></select>
      </div>
      <button id="live-sync"><span class="si">↻</span>&nbsp;LIVE SYNC</button>
      <div id="cond">–</div>
      <div class="plbl">This week's forecast — real data</div>
      <div id="daytabs"></div>
      <hr class="pdiv">
      <div class="plbl">See different conditions (examples, not live)</div>
      <div class="presets">
        <button class="pbtn" data-preset="perfect">PERFECT SAILING DAY</button>
        <button class="pbtn" data-preset="ideal">IDEAL FOR MOST BOATS</button>
        <button class="pbtn" data-preset="choppy">CHOPPY CONDITIONS</button>
        <button class="pbtn" data-preset="strong">STRONG CONDITIONS</button>
      </div>
    </div>
    <script>
    (function () {
      // Tidal cycle = 12h 25min. Portsmouth HW reference (approx Nov 4 2026 UTC).
      const CYCLE = 745; // minutes
      const REF_HW = new Date('2026-11-04T06:17:00Z').getTime();

      // Port offsets from Portsmouth HW (minutes). Positive = later HW.
      const PORTS = [
        { name: 'Lepe',       sub: 'Launch site',    off:  65 },
        { name: 'Hamble',     sub: 'River Hamble',   off:  60 },
        { name: 'Portsmouth', sub: 'Camber/Hardway', off:   0 },
        { name: 'Chichester', sub: 'Itchenor',       off: -15 },
        { name: 'Lymington',  sub: 'W. Solent',      off:  55 },
        { name: 'Poole',      sub: 'Sandbanks',      off: -65 },
      ];

      const NS = 'http://www.w3.org/2000/svg';
      const SZ = 62, CX = 31, CY = 31, TR = 22; // track radius

      function se(tag, attrs) {
        const e = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        return e;
      }

      // Arc in tide-clock coords: 0° = HW = top, clockwise
      function arc(a1, a2) {
        const f = (a1 - 90) * Math.PI / 180, t = (a2 - 90) * Math.PI / 180;
        const x1 = +(CX + TR * Math.cos(f)).toFixed(2), y1 = +(CY + TR * Math.sin(f)).toFixed(2);
        const x2 = +(CX + TR * Math.cos(t)).toFixed(2), y2 = +(CY + TR * Math.sin(t)).toFixed(2);
        const lg = ((a2 - a1) + 360) % 360 > 180 ? 1 : 0;
        return `M${x1},${y1} A${TR},${TR} 0 ${lg},1 ${x2},${y2}`;
      }

      function buildFace(svg) {
        svg.appendChild(se('circle', { cx: CX, cy: CY, r: 28,
          fill: 'rgba(8,16,28,0.92)', stroke: 'rgba(255,255,255,0.09)', 'stroke-width': 0.5 }));

        // Coloured arcs: green HW zone, amber transition, red LW zone
        [
          { a1: -58, a2:  58, col: 'rgba(35,145,65,0.80)',  w: 4   }, // HW / launch window
          { a1:  58, a2: 122, col: 'rgba(165,125,30,0.65)', w: 3   }, // amber ebb
          { a1: 122, a2: 238, col: 'rgba(165,50,40,0.75)',  w: 4   }, // LW zone
          { a1: 238, a2: 302, col: 'rgba(165,125,30,0.65)', w: 3   }, // amber flood
        ].forEach(({ a1, a2, col, w }) =>
          svg.appendChild(se('path', { d: arc(a1, a2), fill: 'none',
            stroke: col, 'stroke-width': w, 'stroke-linecap': 'butt' }))
        );

        // HW / LW labels
        [
          { txt: 'HW', x: CX,    y: 9,    fill: 'rgba(80,210,110,0.90)' },
          { txt: 'LW', x: CX,    y: 57,   fill: 'rgba(210,70,60,0.85)'  },
          { txt: 'EBB',   x: CX + 23, y: CY + 2, fill: 'rgba(221,238,255,0.28)', rot: `rotate(-90,${CX+23},${CY})` },
          { txt: 'FLOOD', x: CX - 23, y: CY + 2, fill: 'rgba(221,238,255,0.28)', rot: `rotate(90,${CX-23},${CY})`  },
        ].forEach(({ txt, x, y, fill, rot }) => {
          const t = se('text', { x, y, fill,
            'font-size': txt.length > 2 ? 4 : 5.5, 'font-family': 'system-ui,sans-serif',
            'font-weight': '700', 'text-anchor': 'middle', 'letter-spacing': '0.5',
            ...(rot ? { transform: rot } : {}),
          });
          t.textContent = txt;
          svg.appendChild(t);
        });
      }

      function getPhase(offMin) {
        const elapsed = (Date.now() - (REF_HW + offMin * 60000)) / 60000;
        return ((elapsed % CYCLE) + CYCLE) % CYCLE; // 0=HW, ~372=LW
      }

      function fmt(m) { return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`; }

      function statusText(phase) {
        if (phase < CYCLE / 2) {
          const m = Math.round(CYCLE / 2 - phase);
          return { txt: `LW in ${fmt(m)}`, ok: phase < 115 };
        } else {
          const m = Math.round(CYCLE - phase);
          return { txt: `HW in ${fmt(m)}`, ok: phase > 630 };
        }
      }

      const WHY = {
        Lepe:       'Your launch site. The slipway dries at low water, so this is the clock that decides when you can actually get a boat in.',
        Hamble:     'River Hamble: busy marinas and moorings. Useful for planning a launch or return from the north-west Solent.',
        Portsmouth: 'The reference port. Other ports are timed as offsets from here, so it is the baseline for the whole cycle.',
        Chichester: 'Itchenor and Chichester Harbour: shallow creeks that are only navigable around high water.',
        Lymington:  'West Solent. Tides run strongly through the Needles channel, so timing matters for crossings.',
        Poole:      'Poole Harbour and Sandbanks: famously long, double high water, and it runs ahead of the Solent ports.',
      };
      let sel = 'Lepe';
      const mainSvg = document.getElementById('tide-svg');
      buildFace(mainSvg);
      const needle = se('line', { 'stroke-width': 2.2, 'stroke-linecap': 'round' });
      mainSvg.appendChild(needle);
      mainSvg.appendChild(se('circle', { cx: CX, cy: CY, r: 2.5, fill: 'rgba(221,238,255,0.9)' }));
      const $ = (id) => document.getElementById(id);

      function render() {
        const p = PORTS.find(x => x.name === sel);
        $('tide-name').textContent = p.name;
        $('tide-sub').textContent = p.sub;
        $('tide-why').textContent = WHY[p.name];
        const opts = $('tide-opts'); opts.innerHTML = '';
        PORTS.filter(x => x.name !== sel).forEach(o => {
          const b = document.createElement('button'); b.className = 'topt'; b.dataset.port = o.name;
          b.innerHTML = `<span>${o.name}<br><small>${o.sub}</small></span><small class="ost"></small>`;
          b.onclick = () => { sel = o.name; render(); tick(); };
          opts.appendChild(b);
        });
      }

      function tick() {
        const p = PORTS.find(x => x.name === sel);
        const phase = getPhase(p.off);
        const rad = ((phase / CYCLE) * 360 - 90) * Math.PI / 180;
        const inWindow = phase < 115 || phase > 630;
        needle.setAttribute('stroke', inWindow ? 'rgba(70,215,105,0.95)' : 'rgba(221,238,255,0.85)');
        needle.setAttribute('x1', +(CX - 6 * Math.cos(rad)).toFixed(2));
        needle.setAttribute('y1', +(CY - 6 * Math.sin(rad)).toFixed(2));
        needle.setAttribute('x2', +(CX + 19 * Math.cos(rad)).toFixed(2));
        needle.setAttribute('y2', +(CY + 19 * Math.sin(rad)).toFixed(2));
        const m = statusText(phase);
        const st = $('tide-status');
        st.textContent = m.ok ? '✓ LAUNCH WINDOW · ' + m.txt : m.txt;
        st.style.color = m.ok ? 'rgba(70,215,105,0.9)' : 'rgba(221,238,255,0.6)';
        document.querySelectorAll('.topt').forEach(b => {
          const o = PORTS.find(x => x.name === b.dataset.port);
          const r = statusText(getPhase(o.off));
          const e = b.querySelector('.ost');
          e.textContent = r.ok ? '✓ LAUNCH' : r.txt;
          e.style.color = r.ok ? 'rgba(70,215,105,0.9)' : '';
        });
      }

      render();
      tick();
      setInterval(tick, 15000);
    })();
    </script>
  </body>
</html>
